name: Auto Generate Sitemap XML

on:
  push:
    branches:
      - main  # Set to 'master' if your main branch is called master

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Fetches full Git history to read file commit dates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Update Article JS Dates & Generate Sitemap XML
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const vm = require("vm");
          const { execSync } = require("child_process");

          const SITE_URL = "https://dailyglamstore.in";

          // 1. Core Static Pages
          const staticPages = [
            { url: "/", priority: "1.0", changefreq: "daily" },
            { url: "/shop.html", priority: "0.9", changefreq: "daily" },
            { url: "/beauty-blog.html", priority: "0.8", changefreq: "weekly" },
            { url: "/share-feedback.html", priority: "0.5", changefreq: "monthly" }
          ];

          // Safely load ARTICLE_REGISTRY
          function loadArticleRegistry() {
            const registryPath = path.join(process.cwd(), "article-registry.js");
            if (!fs.existsSync(registryPath)) return {};
            try {
              const fileContent = fs.readFileSync(registryPath, "utf8");
              const sandbox = { window: {} };
              vm.createContext(sandbox);
              vm.runInContext(fileContent, sandbox);
              return sandbox.window.ARTICLE_REGISTRY || {};
            } catch (err) {
              return {};
            }
          }

          // Fetch Git last commit date & auto-update file if needed
          function processArticleFile(category, slug) {
            const possiblePaths = [
              path.join(process.cwd(), `${category}-articles`, `${slug}.js`),
              path.join(process.cwd(), "articles", category, `${slug}.js`),
              path.join(process.cwd(), `${slug}.js`)
            ];
            const filePath = possiblePaths.find(p => fs.existsSync(p));
            if (!filePath) return null;

            try {
              let content = fs.readFileSync(filePath, "utf8");

              // 1. Get the exact date the file was last committed in Git
              let gitDate = "";
              try {
                const gitLog = execSync(`git log -1 --format="%ad" --date=format:"%Y-%m-%d" -- "${filePath}"`, { encoding: "utf8" }).trim();
                if (gitLog) gitDate = gitLog;
              } catch (e) {}

              const fallbackToday = new Date().toISOString().split("T")[0];
              const lastModDate = gitDate || fallbackToday;

              // 2. Automatically update dateModified inside the article .js file
              if (content.includes("dateModified:")) {
                content = content.replace(/dateModified\s*:\s*["\x27][^"\x27]*["\x27]/, `dateModified: "${lastModDate}T00:00:00+05:30"`);
              } else if (content.includes("date:")) {
                content = content.replace(/(date\s*:\s*["\x27][^"\x27]*["\x27],?)/, `$1\n  dateModified: "${lastModDate}T00:00:00+05:30",`);
              }
              fs.writeFileSync(filePath, content, "utf8");

              // 3. Extract canonical URL if present
              const urlMatch = content.match(/url\s*:\s*["\x27]([^"\x27]+)["\x27]/);

              return {
                date: lastModDate,
                canonicalPath: urlMatch ? urlMatch[1] : null
              };
            } catch (e) {
              return null;
            }
          }

          const fallbackDate = new Date().toISOString().split("T")[0];
          const urlSet = new Map();

          // Add Core Pages
          staticPages.forEach(p => {
            urlSet.set(p.url, {
              loc: `${SITE_URL}${p.url}`,
              lastmod: fallbackDate,
              changefreq: p.changefreq,
              priority: p.priority
            });
          });

          // Add Article Pages & Sync Dates
          const registry = loadArticleRegistry();
          Object.keys(registry).forEach(category => {
            const slugs = registry[category];
            if (!Array.isArray(slugs)) return;
            slugs.forEach(slug => {
              const meta = processArticleFile(category, slug);
              const lastmod = (meta && meta.date) ? meta.date : fallbackDate;
              let relativeUrl = (meta && meta.canonicalPath) ? meta.canonicalPath : `/articles/${category}/${slug}.html`;
              if (!relativeUrl.startsWith("/")) relativeUrl = "/" + relativeUrl;
              urlSet.set(relativeUrl, {
                loc: `${SITE_URL}${relativeUrl}`,
                lastmod: lastmod,
                changefreq: "weekly",
                priority: "0.8"
              });
            });
          });

          // Write XML
          let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;
          urlSet.forEach(item => {
            xml += `  <url>\n    <loc>${item.loc}</loc>\n    <lastmod>${item.lastmod}</lastmod>\n    <changefreq>${item.changefreq}</changefreq>\n    <priority>${item.priority}</priority>\n  </url>\n`;
          });
          xml += `</urlset>`;

          fs.writeFileSync(path.join(process.cwd(), "sitemap.xml"), xml, "utf8");
          console.log(`✅ Updated article dates & generated sitemap.xml with ${urlSet.size} total URLs!`);
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update article dateModified and sitemap.xml"
          file_pattern: "*.js sitemap.xml"
