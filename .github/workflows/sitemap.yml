name: Auto Generate Sitemap XML & Registry

on:
  push:
    branches:
      - main  # Set to 'master' if your main branch is called master

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full Git history to read file commit dates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Auto-Scan Articles, Update Registry & Generate Sitemap XML
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const SITE_URL = "https://dailyglamstore.in";

          // 1. Static Core Pages
          const staticPages = [
            { url: "/", priority: "1.0", changefreq: "daily" },
            { url: "/shop.html", priority: "0.9", changefreq: "daily" },
            { url: "/beauty-blog.html", priority: "0.8", changefreq: "weekly" },
            { url: "/share-feedback/", priority: "0.5", changefreq: "monthly" }
          ];

          const fallbackToday = new Date().toISOString().split("T")[0];
          const urlSet = new Map();
          const registryData = {};

          // Add Core Pages to Sitemap
          staticPages.forEach(p => {
            urlSet.set(p.url, {
              loc: `${SITE_URL}${p.url}`,
              lastmod: fallbackToday,
              changefreq: p.changefreq,
              priority: p.priority
            });
          });

          // Helper to process individual JS files
          function processArticleFile(filePath, category, slug) {
            try {
              let content = fs.readFileSync(filePath, "utf8");

              let gitDate = "";
              try {
                const gitLog = execSync(`git log -1 --format="%ad" --date=format:"%Y-%m-%d" -- "${filePath}"`, { encoding: "utf8" }).trim();
                if (gitLog) gitDate = gitLog;
              } catch (e) {}

              const lastModDate = gitDate || fallbackToday;

              // Auto-update dateModified inside the article .js file
              if (content.includes("dateModified:")) {
                content = content.replace(/dateModified\s*:\s*["\x27][^"\x27]*["\x27]/, `dateModified: "${lastModDate}T00:00:00+05:30"`);
              } else if (content.includes("date:")) {
                content = content.replace(/(date\s*:\s*["\x27][^"\x27]*["\x27],?)/, `$1\n  dateModified: "${lastModDate}T00:00:00+05:30",`);
              }
              fs.writeFileSync(filePath, content, "utf8");

              const urlMatch = content.match(/url\s*:\s*["\x27]([^"\x27]+)["\x27]/);
              let relativeUrl = urlMatch ? urlMatch[1] : `/articles/${category}/${slug}.html`;
              if (!relativeUrl.startsWith("/")) relativeUrl = "/" + relativeUrl;

              urlSet.set(relativeUrl, {
                loc: `${SITE_URL}${relativeUrl}`,
                lastmod: lastModDate,
                changefreq: "weekly",
                priority: "0.8"
              });

              // Add slug to registry
              if (!registryData[category]) registryData[category] = [];
              if (!registryData[category].includes(slug)) {
                registryData[category].push(slug);
              }
            } catch (e) {
              console.error(`Error processing ${filePath}:`, e);
            }
          }

          // 2. Scan folders dynamically
          const searchFolders = ["articles", "skincare-articles", "haircare-articles"];

          searchFolders.forEach(folderName => {
            const folderPath = path.join(process.cwd(), folderName);
            if (!fs.existsSync(folderPath)) return;

            const entries = fs.readdirSync(folderPath, { withFileTypes: true });

            entries.forEach(entry => {
              if (entry.isDirectory()) {
                const category = entry.name;
                const subFolderPath = path.join(folderPath, category);
                const files = fs.readdirSync(subFolderPath);

                files.forEach(file => {
                  if (file.endsWith(".js") && file !== "article-registry.js") {
                    const slug = path.basename(file, ".js");
                    processArticleFile(path.join(subFolderPath, file), category, slug);
                  }
                });
              } else if (entry.isFile() && entry.name.endsWith(".js") && entry.name !== "article-registry.js") {
                const category = folderName.replace("-articles", "");
                const slug = path.basename(entry.name, ".js");
                processArticleFile(path.join(folderPath, entry.name), category, slug);
              }
            });
          });

          // 3. Auto-generate article-registry.js
          const registryFileContent = `window.ARTICLE_REGISTRY = ${JSON.stringify(registryData, null, 2)};\n`;
          fs.writeFileSync(path.join(process.cwd(), "article-registry.js"), registryFileContent, "utf8");
          console.log("✅ Dynamically generated article-registry.js!");

          // 4. Generate XML
          let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;
          urlSet.forEach(item => {
            xml += `  <url>\n    <loc>${item.loc}</loc>\n    <lastmod>${item.lastmod}</lastmod>\n    <changefreq>${item.changefreq}</changefreq>\n    <priority>${item.priority}</priority>\n  </url>\n`;
          });
          xml += `</urlset>`;

          fs.writeFileSync(path.join(process.cwd(), "sitemap.xml"), xml, "utf8");
          console.log(`✅ Generated sitemap.xml with ${urlSet.size} total URLs!`);
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update article-registry.js, dateModified, and sitemap.xml"
          file_pattern: "**/*.js sitemap.xml article-registry.js"
