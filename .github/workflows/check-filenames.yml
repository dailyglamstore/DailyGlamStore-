name: Data & Path Validator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Non-Breaking Spaces & Check
        run: |
          FOUND_ERRORS=0

          echo "🔍 Scanning file and folder names..."
          while IFS= read -r item; do
            if [[ "$item" =~ [[:space:]]$ ]] || echo "$item" | grep -P -q "[^\x00-\x7F]"; then
              echo "❌ HIDDEN CHAR IN PATH: \"$item\""
              FOUND_ERRORS=1
            fi
          done < <(find . -mindepth 1 -not -path '*/.*')

          echo "🔍 Cleaning invisible spaces and checking JS files..."
          while IFS= read -r jsfile; do
            # Automatically replace non-breaking spaces with standard spaces
            sed -i 's/\xC2\xA0/ /g' "$jsfile"

            # 1. Syntax Check
            if ! node --check "$jsfile"; then
              echo "❌ SYNTAX ERROR DETECTED IN: \"$jsfile\""
              FOUND_ERRORS=1
            fi
          done < <(find . -type f -name "*.js" -not -path '*/.*')

          if [ $FOUND_ERRORS -eq 1 ]; then
            echo "--------------------------------------------------"
            echo "🚨 Deployment blocked due to syntax errors!"
            exit 1
          else
            echo "✅ All paths and JS syntax are clean!"
          fi
