<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Mahashivratri</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at center, #0a0f2c, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
}
  
@keyframes glowBlue {
  from { text-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff; }
  to { text-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff; }
}

@keyframes glowSaffron {
  from { text-shadow: 0 0 10px #ff7b00, 0 0 20px #ff7b00; }
  to { text-shadow: 0 0 20px #ffae00, 0 0 40px #ffae00; }
}
  
.shiva {
  font-size: 100px;
  color: #00eaff;
  animation: glowBlue 1.5s infinite alternate;
}

.trishul {
  font-size: 70px;
  color: #ff7b00;
  animation: glowSaffron 1.5s infinite alternate;
}

h1 {
  margin: 10px 0;
  animation: glowBlue 1.5s infinite alternate;
}

h2 {
  font-size: 18px;
  margin-top: 5px;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: #ff7b00;
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 15px #ff7b00;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

#blessing {
  display: none;
  margin-top: 20px;
  font-size: 18px;
  animation: glowBlue 1.5s infinite alternate;
}
</style>
</head>

<body>

<div>
  <div class="shiva">ॐ</div>
  <div class="trishul">🔱</div>
  <h1>Happy Mahashivratri</h1>
  <h2>From VHP & Bajrang Dal Gurdaspur</h2>

  <button onclick="showBlessing()">Tap to Take Blessings</button>

  <div id="blessing">
    🕉️ May Lord Shiva bless you with strength, peace and success.  
    हर हर महादेव 🔱
  </div>
</div>

<script>
function showBlessing() {
  document.getElementById("blessing").style.display = "block";
}
</script>

</body>
  </html>
